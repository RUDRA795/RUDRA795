<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="celestialAura" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#bfdbfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="celestialCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#93c5fd" />
      <stop offset="65%" stop-color="#1d4ed8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes flamePulse { 0%, 100% { transform: scaleY(1); opacity: 0.85; } 50% { transform: scaleY(1.08); opacity: 1; } }
      .warrior-float { animation: floatAnim 4s ease-in-out infinite; }
      .ring-spin { animation: spinSlow 30s linear infinite; transform-origin: 300px 360px; }
      .flame { animation: flamePulse 2s ease-in-out infinite; transform-origin: 300px 550px; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.3" rx="16"/>

  <!-- Character Banner Header -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#ffffff" filter="url(#glow)" />
    <text x="24" y="16" fill="#93c5fd" font-size="10" class="mono" font-weight="700">SPEC://CELESTIAL_HERALD</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="900" letter-spacing="3">CELESTIAL WARRIOR</text>
    <text x="0" y="72" fill="#dbeafe" font-size="11" class="mono">COSMIC SUPERNOVA NEBULA HARMONICS</text>
  </g>

  <!-- Aura Energy Field -->
  <circle cx="300" cy="360" r="230" fill="url(#celestialCore)" opacity="0.65"/>

  <!-- Rotating Astral Constellation Rings -->
  <g class="ring-spin">
    <circle cx="300" cy="360" r="190" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="25 25 50 15" opacity="0.4"/>
    <circle cx="300" cy="360" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 18" opacity="0.6"/>
    <!-- Astral Stars -->
    <polygon points="300,165 303,173 311,173 305,178 307,186 300,181 293,186 295,178 289,173 297,173" fill="#ffffff" filter="url(#glow)"/>
    <polygon points="300,535 303,543 311,543 305,548 307,556 300,551 293,556 295,548 289,543 297,543" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Upward Cosmic Aura -->
  <g class="flame">
    <path d="M 300 95 Q 435 255 405 535 Q 300 580 195 535 Q 165 255 300 95 Z" fill="url(#celestialAura)" filter="url(#glow)"/>
    <path d="M 265 515 Q 220 315 270 195" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M 335 515 Q 380 315 330 195" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9"/>
  </g>

  <!-- Character Silhouette & Celestial Regalia -->
  <g class="warrior-float" transform="translate(300, 360)">
    <!-- Astral Feather Wings -->
    <path d="M -55 -15 L -140 -85 L -85 5 L -145 65 L -55 20 Z" fill="#0f172a" stroke="#bfdbfe" stroke-width="2" filter="url(#glow)"/>
    <path d="M 55 -15 L 140 -85 L 85 5 L 145 65 L 55 20 Z" fill="#0f172a" stroke="#bfdbfe" stroke-width="2" filter="url(#glow)"/>

    <!-- Wing Highlights -->
    <line x1="-55" y1="-15" x2="-130" y2="-75" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="55" y1="-15" x2="130" y2="-75" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Celestial Armor Torso -->
    <path d="M -26 -25 L 26 -25 L 36 35 L 20 105 L -20 105 L -36 35 Z" fill="#0b1329" stroke="#93c5fd" stroke-width="2"/>
    <path d="M -16 -15 L 16 -15 L 24 30 L 0 58 L -24 30 Z" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Starlight Supernova Core -->
    <polygon points="0,5 -12,25 12,25" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="0" cy="18" r="5" fill="#60a5fa"/>

    <!-- Pauldrons -->
    <path d="M -26 -25 L -54 -40 L -64 -10 L -32 -6 Z" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>
    <path d="M 26 -25 L 54 -40 L 64 -10 L 32 -6 Z" fill="#1e293b" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Head & Helm -->
    <rect x="-8" y="-40" width="16" height="16" fill="#0b1329"/>
    <path d="M -18 -58 L 18 -58 L 14 -35 L -14 -35 Z" fill="#172554" stroke="#93c5fd" stroke-width="1.5"/>
    
    <!-- Angelic / Spiked Cosmic Anime Helm Crest -->
    <path d="M 0 -125 L -16 -80 L -36 -95 L -24 -68 L -46 -60 L -20 -50 L 0 -66 L 20 -50 L 46 -60 L 24 -68 L 36 -95 L 16 -80 Z" fill="#1e293b" stroke="#ffffff" stroke-width="2.2"/>
    
    <!-- Luminous Starlight Visor -->
    <line x1="-16" y1="-46" x2="16" y2="-46" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>

    <!-- Twin Astral Halos Orbiting -->
    <ellipse cx="0" cy="-65" rx="35" ry="10" fill="none" stroke="#93c5fd" stroke-width="2" filter="url(#glow)" transform="rotate(-15 0 -65)"/>
  </g>

  <!-- Base Shockwave -->
  <ellipse cx="300" cy="550" rx="160" ry="20" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Footer Specs -->
  <g transform="translate(30, 640)">
    <text x="0" y="0" fill="#3b82f6" font-size="10" class="mono">AFFINITY: UNIFIED INTELLIGENCE // REALM: COSMIC // POSE: ASTRAL ASCENDANCE</text>
    <line x1="0" y1="12" x2="540" y2="12" stroke="#93c5fd" stroke-opacity="0.2" stroke-width="1"/>
  </g>
</svg>
