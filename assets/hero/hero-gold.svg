<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140c03" />
      <stop offset="100%" stop-color="#070401" />
    </linearGradient>
    <linearGradient id="goldAura" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#fb8500" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#ffe6a7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#ffb703" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes flamePulse { 0%, 100% { transform: scaleY(1); opacity: 0.85; } 50% { transform: scaleY(1.08); opacity: 1; } }
      .warrior-float { animation: floatAnim 4s ease-in-out infinite; }
      .ring-spin { animation: spinSlow 25s linear infinite; transform-origin: 300px 360px; }
      .flame { animation: flamePulse 2s ease-in-out infinite; transform-origin: 300px 550px; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-opacity="0.3" rx="16"/>

  <!-- Character Banner Header -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#ffb703" fill-opacity="0.1" stroke="#ffb703" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#ffb703" filter="url(#glow)" />
    <text x="24" y="16" fill="#ffb703" font-size="10" class="mono" font-weight="700">SPEC://SOLAR_ASCENDANT</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="900" letter-spacing="3">GOLDEN WARRIOR</text>
    <text x="0" y="72" fill="#fde047" font-size="11" class="mono">SOLAR CORONAL ASCENDED FLARE AURA</text>
  </g>

  <!-- Aura Energy Field -->
  <circle cx="300" cy="360" r="230" fill="url(#goldCore)" opacity="0.6"/>

  <!-- Rotating Solar Halo -->
  <g class="ring-spin">
    <circle cx="300" cy="360" r="190" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-dasharray="30 15 10 15" opacity="0.5"/>
    <circle cx="300" cy="360" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
    <!-- Solar Ray Spikes -->
    <polygon points="300,150 305,170 295,170" fill="#fde047" filter="url(#glow)"/>
    <polygon points="300,570 305,550 295,550" fill="#fde047" filter="url(#glow)"/>
    <polygon points="90,360 110,365 110,355" fill="#fde047" filter="url(#glow)"/>
    <polygon points="510,360 490,365 490,355" fill="#fde047" filter="url(#glow)"/>
  </g>

  <!-- Upward Solar Aura Flames -->
  <g class="flame">
    <path d="M 300 100 Q 430 260 410 540 Q 300 580 190 540 Q 170 260 300 100 Z" fill="url(#goldAura)" filter="url(#glow)"/>
    <path d="M 260 520 Q 220 320 270 200" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M 340 520 Q 380 320 330 200" stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.9"/>
  </g>

  <!-- Character Silhouette & Solar Armor -->
  <g class="warrior-float" transform="translate(300, 360)">
    <!-- Floating Solar Crest Halo behind head -->
    <circle cx="0" cy="-60" r="45" fill="none" stroke="#ffb703" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0" cy="-60" r="55" fill="none" stroke="#fde047" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/>

    <!-- Solar Cape / Radiating Back Energy Blades -->
    <path d="M -50 -10 L -125 -65 L -80 10 L -130 75 L -45 25 Z" fill="#2d1500" stroke="#ffb703" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M 50 -10 L 125 -65 L 80 10 L 130 75 L 45 25 Z" fill="#2d1500" stroke="#ffb703" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Heavy Gilded Torso Plate -->
    <path d="M -28 -25 L 28 -25 L 36 35 L 20 105 L -20 105 L -36 35 Z" fill="#140a02" stroke="#f59e0b" stroke-width="2"/>
    <path d="M -16 -15 L 16 -15 L 24 30 L 0 58 L -24 30 Z" fill="#451a03" stroke="#ffb703" stroke-width="1.5"/>

    <!-- Solar Fusion Core -->
    <circle cx="0" cy="18" r="10" fill="#fde047" filter="url(#glow)"/>
    <circle cx="0" cy="18" r="4" fill="#ffffff"/>

    <!-- Gilded Heavy Pauldrons -->
    <path d="M -28 -25 L -56 -42 L -66 -12 L -34 -6 Z" fill="#2d1500" stroke="#ffb703" stroke-width="2"/>
    <path d="M 28 -25 L 56 -42 L 66 -12 L 34 -6 Z" fill="#2d1500" stroke="#ffb703" stroke-width="2"/>

    <!-- Head & Solar Crest Helmet -->
    <rect x="-8" y="-40" width="16" height="16" fill="#140a02"/>
    <path d="M -18 -58 L 18 -58 L 14 -35 L -14 -35 Z" fill="#1c0f05" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Majestic Spiked Solar Anime Crown / Crest -->
    <path d="M 0 -120 L -15 -80 L -35 -95 L -22 -68 L -42 -60 L -18 -50 L 0 -65 L 18 -50 L 42 -60 L 22 -68 L 35 -95 L 15 -80 Z" fill="#2d1500" stroke="#ffb703" stroke-width="2.5"/>
    
    <!-- Glowing Golden Eyes / Visor -->
    <line x1="-16" y1="-46" x2="16" y2="-46" stroke="#fde047" stroke-width="3" filter="url(#glow)"/>
    <line x1="-10" y1="-46" x2="10" y2="-46" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Solar Energy Glaive / Halberd Staff -->
    <line x1="85" y1="130" x2="-85" y2="-130" stroke="#ffb703" stroke-width="3.5" filter="url(#glow)" stroke-linecap="round"/>
    <line x1="85" y1="130" x2="-85" y2="-130" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="-85,-130 -105,-155 -70,-140" fill="#fde047" filter="url(#glow)"/>
  </g>

  <!-- Energy Wave Base -->
  <ellipse cx="300" cy="550" rx="160" ry="20" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.6" filter="url(#glow)"/>

  <!-- Footer Specs -->
  <g transform="translate(30, 640)">
    <text x="0" y="0" fill="#a16207" font-size="10" class="mono">AFFINITY: MACHINE LEARNING // POWER: TRANSCENDENT // POSE: SOLAR GLAIVE STANCE</text>
    <line x1="0" y1="12" x2="540" y2="12" stroke="#ffb703" stroke-opacity="0.2" stroke-width="1"/>
  </g>
</svg>
