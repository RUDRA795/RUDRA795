<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021014" />
      <stop offset="100%" stop-color="#010608" />
    </linearGradient>
    <linearGradient id="cyberAura" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0891b2" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#67e8f9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#cffafe" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cyberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#0e7490" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="matrixPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22d3ee" opacity="0.3"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <style>
      @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes flamePulse { 0%, 100% { transform: scaleY(1); opacity: 0.85; } 50% { transform: scaleY(1.05); opacity: 1; } }
      .warrior-float { animation: floatAnim 4s ease-in-out infinite; }
      .ring-spin { animation: spinSlow 18s linear infinite; transform-origin: 300px 360px; }
      .flame { animation: flamePulse 2s ease-in-out infinite; transform-origin: 300px 550px; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#matrixPattern)" rx="16"/>
  <rect width="100%" height="100%" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" rx="16"/>

  <!-- Character Banner Header -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#22d3ee" filter="url(#glow)" />
    <text x="24" y="16" fill="#22d3ee" font-size="10" class="mono" font-weight="700">SPEC://CYBER_AEGIS</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="900" letter-spacing="3">CYBER WARRIOR</text>
    <text x="0" y="72" fill="#a5f3fc" font-size="11" class="mono">HOLOGRAPHIC QUANTUM MATRIX SHIELD</text>
  </g>

  <!-- Aura Energy Field -->
  <circle cx="300" cy="360" r="215" fill="url(#cyberCore)" opacity="0.6"/>

  <!-- Hexagonal Tech Rings -->
  <g class="ring-spin">
    <circle cx="300" cy="360" r="185" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="12 18 36 12" opacity="0.5"/>
    <polygon points="300,195 440,275 440,445 300,525 160,445 160,275" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
  </g>

  <!-- Upward Cyber Aura -->
  <g class="flame">
    <path d="M 300 115 Q 425 275 395 535 Q 300 575 205 535 Q 175 275 300 115 Z" fill="url(#cyberAura)" filter="url(#glow)"/>
    <path d="M 270 515 Q 235 330 270 215" stroke="#ecfeff" stroke-width="2.5" fill="none" opacity="0.85"/>
    <path d="M 330 515 Q 365 330 330 215" stroke="#ecfeff" stroke-width="2.5" fill="none" opacity="0.85"/>
  </g>

  <!-- Character Silhouette & Cyber Exosuit -->
  <g class="warrior-float" transform="translate(300, 360)">
    <!-- Holographic Floating Aegis Shields -->
    <polygon points="-110,-40 -150,-10 -130,50 -90,20" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" opacity="0.85"/>
    <polygon points="110,-40 150,-10 130,50 90,20" fill="#083344" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" opacity="0.85"/>
    
    <!-- Torso Armor -->
    <path d="M -26 -25 L 26 -25 L 35 35 L 19 105 L -19 105 L -35 35 Z" fill="#041b24" stroke="#22d3ee" stroke-width="2"/>
    <path d="M -16 -15 L 16 -15 L 22 30 L 0 58 L -22 30 Z" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>

    <!-- Matrix Core -->
    <rect x="-10" y="8" width="20" height="20" fill="#22d3ee" transform="rotate(45 0 18)" filter="url(#glow)"/>
    <circle cx="0" cy="18" r="4" fill="#ffffff"/>

    <!-- Pauldrons -->
    <path d="M -26 -25 L -52 -40 L -60 -10 L -30 -6 Z" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
    <path d="M 26 -25 L 52 -40 L 60 -10 L 30 -6 Z" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>

    <!-- Head & Helm -->
    <rect x="-8" y="-40" width="16" height="16" fill="#041b24"/>
    <path d="M -18 -58 L 18 -58 L 14 -35 L -14 -35 Z" fill="#082f49" stroke="#22d3ee" stroke-width="1.5"/>
    
    <!-- Cyber Geometric Anime Horns / Crest -->
    <path d="M 0 -110 L -14 -75 L -32 -88 L -22 -65 L -40 -58 L -18 -48 L 0 -62 L 18 -48 L 40 -58 L 22 -65 L 32 -88 L 14 -75 Z" fill="#083344" stroke="#22d3ee" stroke-width="2.2"/>
    
    <!-- Holographic Hex Visor -->
    <polygon points="-16,-48 16,-48 10,-42 -10,-42" fill="#a5f3fc" filter="url(#glow)"/>
    <line x1="-12" y1="-45" x2="12" y2="-45" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Floating Hex Grid Orbiters -->
    <polygon points="-70,-90 -60,-105 -45,-105 -40,-90 -50,-75 -65,-75" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8"/>
    <polygon points="70,-90 60,-105 45,-105 40,-90 50,-75 65,-75" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Hex Base -->
  <polygon points="300,530 420,550 380,570 300,575 220,570 180,550" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" filter="url(#glow)"/>

  <!-- Footer Specs -->
  <g transform="translate(30, 640)">
    <text x="0" y="0" fill="#0891b2" font-size="10" class="mono">AFFINITY: SYSTEM ARCHITECTURE // PROTOCOL: ENCRYPTED // POSE: MATRIX AEGIS</text>
    <line x1="0" y1="12" x2="540" y2="12" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  </g>
</svg>
