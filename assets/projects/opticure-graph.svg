<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="optiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d12" />
      <stop offset="50%" stop-color="#061e24" />
      <stop offset="100%" stop-color="#02080a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes dashFlow { to { stroke-dashoffset: -50; } }
      .optimal-edge { stroke-dasharray: 6 4; animation: dashFlow 2s linear infinite; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.5px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#optiBg)" rx="12" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Card Top Banner -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="175" height="24" rx="4" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="87" y="16" fill="#34d399" font-size="10.5" class="mono" font-weight="700" text-anchor="middle">🏥 HEALTHCARE OPTIMIZATION</text>
    
    <text x="0" y="55" fill="#ffffff" font-size="24" class="sans" font-weight="900">OPTICURE AI — MULTISTAGE GRAPH &amp; DYNAMIC PROGRAMMING</text>
    <text x="0" y="76" fill="#94a3b8" font-size="13" class="sans">
      Reduces appointment waiting latency by computing optimal paths across multi-doctor schedules • Android + Firebase
    </text>
  </g>

  <!-- MULTISTAGE GRAPH VISUALIZATION -->
  <g transform="translate(45, 120)">
    <!-- Stage Column Dividers -->
    <line x1="80" y1="10" x2="80" y2="190" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 4"/>
    <line x1="280" y1="10" x2="280" y2="190" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 4"/>
    <line x1="520" y1="10" x2="520" y2="190" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 4"/>
    <line x1="740" y1="10" x2="740" y2="190" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 4"/>

    <text x="80" y="0" fill="#6ee7b7" font-size="10" class="mono" text-anchor="middle">STAGE 1: PATIENT</text>
    <text x="280" y="0" fill="#6ee7b7" font-size="10" class="mono" text-anchor="middle">STAGE 2: SPECIALISTS</text>
    <text x="520" y="0" fill="#6ee7b7" font-size="10" class="mono" text-anchor="middle">STAGE 3: TIME &amp; LATENCY</text>
    <text x="740" y="0" fill="#6ee7b7" font-size="10" class="mono" text-anchor="middle">STAGE 4: OPTIMAL SLOT</text>

    <!-- Sub-optimal Edges (Dim gray) -->
    <line x1="80" y1="100" x2="280" y2="40" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="100" x2="280" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="280" y1="40" x2="520" y2="40" stroke="#334155" stroke-width="1.5"/>
    <line x1="280" y1="160" x2="520" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="520" y1="40" x2="740" y2="100" stroke="#334155" stroke-width="1.5"/>
    <line x1="520" y1="160" x2="740" y2="100" stroke="#334155" stroke-width="1.5"/>

    <!-- OPTIMAL PATH EDGES (Dynamic Programming Computed - Glowing Emerald) -->
    <line x1="80" y1="100" x2="280" y2="100" stroke="#10b981" stroke-width="3" class="optimal-edge" filter="url(#glow)"/>
    <line x1="280" y1="100" x2="520" y2="100" stroke="#10b981" stroke-width="3" class="optimal-edge" filter="url(#glow)"/>
    <line x1="520" y1="100" x2="740" y2="100" stroke="#10b981" stroke-width="3" class="optimal-edge" filter="url(#glow)"/>

    <!-- Cost Labels -->
    <rect x="160" y="85" width="45" height="18" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="182" y="98" fill="#6ee7b7" font-size="9" class="mono" text-anchor="middle">w = 12</text>

    <rect x="380" y="85" width="45" height="18" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="402" y="98" fill="#6ee7b7" font-size="9" class="mono" text-anchor="middle">w = 04</text>

    <rect x="610" y="85" width="45" height="18" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="632" y="98" fill="#6ee7b7" font-size="9" class="mono" text-anchor="middle">MIN COST</text>

    <!-- STAGE 1 NODE -->
    <circle cx="80" cy="100" r="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text x="80" y="104" fill="#ffffff" font-size="9" class="mono" font-weight="700" text-anchor="middle">P_0</text>

    <!-- STAGE 2 NODES -->
    <circle cx="280" cy="40" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="280" y="44" fill="#94a3b8" font-size="8" class="mono" text-anchor="middle">Doc_A</text>
    <circle cx="280" cy="100" r="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text x="280" y="104" fill="#ffffff" font-size="8" class="mono" font-weight="700" text-anchor="middle">Doc_B*</text>
    <circle cx="280" cy="160" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="280" y="164" fill="#94a3b8" font-size="8" class="mono" text-anchor="middle">Doc_C</text>

    <!-- STAGE 3 NODES -->
    <circle cx="520" cy="40" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="520" y="44" fill="#94a3b8" font-size="8" class="mono" text-anchor="middle">T_High</text>
    <circle cx="520" cy="100" r="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <text x="520" y="104" fill="#ffffff" font-size="8" class="mono" font-weight="700" text-anchor="middle">T_Opt*</text>
    <circle cx="520" cy="160" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="520" y="164" fill="#94a3b8" font-size="8" class="mono" text-anchor="middle">T_Late</text>

    <!-- STAGE 4 NODE -->
    <circle cx="740" cy="100" r="22" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <text x="740" y="104" fill="#ffffff" font-size="9" class="mono" font-weight="800" text-anchor="middle">RECOM</text>
  </g>

  <!-- Algorithm Callout Footer -->
  <g transform="translate(35, 325)">
    <text x="0" y="0" fill="#6ee7b7" font-size="10.5" class="mono">
      DP RECURRENCE: cost(i, j) = min { c(j, k) + cost(i+1, k) } • ZERO UNNECESSARY WAITING
    </text>
  </g>
</svg>
