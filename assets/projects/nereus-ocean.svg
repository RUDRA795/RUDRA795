<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nereusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02141f" />
      <stop offset="50%" stop-color="#04273b" />
      <stop offset="100%" stop-color="#010a10" />
    </linearGradient>
    <linearGradient id="oceanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes waveScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      .wave-motion { animation: waveScroll 6s linear infinite; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.5px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#nereusBg)" rx="12" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Card Top Banner -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="95" y="16" fill="#38bdf8" font-size="10.5" class="mono" font-weight="700" text-anchor="middle">🌊 OCEANOGRAPHIC AI</text>
    
    <text x="0" y="55" fill="#ffffff" font-size="24" class="sans" font-weight="900">NEREUS AI — CONVERSATIONAL OCEAN SCIENCE</text>
    <text x="0" y="76" fill="#94a3b8" font-size="13" class="sans">
      Natural language exploration of ARGO float sensor telemetry, bathymetric salinity, pressure &amp; thermocline data
    </text>
  </g>

  <!-- WAVEFORM & SCIENTIFIC TELEMETRY -->
  <g transform="translate(35, 110)">
    <!-- Scientific Grid Display -->
    <rect x="0" y="0" width="830" height="170" rx="8" fill="#041824" stroke="#0c4a6e" stroke-width="1"/>
    
    <!-- Depth markers -->
    <text x="20" y="30" fill="#38bdf8" font-size="9" class="mono">SURFACE [0m]</text>
    <line x1="20" y1="36" x2="810" y2="36" stroke="#0284c7" stroke-opacity="0.2" stroke-dasharray="3 3"/>
    
    <text x="20" y="85" fill="#38bdf8" font-size="9" class="mono">THERMOCLINE [800m]</text>
    <line x1="20" y1="91" x2="810" y2="91" stroke="#0284c7" stroke-opacity="0.2" stroke-dasharray="3 3"/>

    <text x="20" y="140" fill="#38bdf8" font-size="9" class="mono">ABYSSAL [2000m]</text>
    <line x1="20" y1="146" x2="810" y2="146" stroke="#0284c7" stroke-opacity="0.2" stroke-dasharray="3 3"/>

    <!-- Sine Waveforms representing Bathymetric acoustic & temperature telemetry -->
    <path d="M 120 45 Q 160 20 200 45 T 280 45 T 360 45 T 440 45 T 520 45 T 600 45 T 680 45 T 760 45" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M 120 100 Q 170 70 220 100 T 320 100 T 420 100 T 520 100 T 620 100 T 720 100 T 800 100" 
          fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Telemetry Float Nodes -->
    <g transform="translate(240, 45)">
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <text x="12" y="-4" fill="#e0f2fe" font-size="9" class="mono">ARGO_FLOAT_#49021</text>
      <text x="12" y="8" fill="#7dd3fc" font-size="8" class="mono">Temp: 4.2°C • Sal: 34.8 PSU</text>
    </g>

    <g transform="translate(540, 100)">
      <circle cx="0" cy="0" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <text x="12" y="-4" fill="#e0f2fe" font-size="9" class="mono">DEEP_SENSOR_#8812</text>
      <text x="12" y="8" fill="#7dd3fc" font-size="8" class="mono">Depth: 1420m • Press: 144 dbar</text>
    </g>

    <!-- Conversational Prompt Pill -->
    <g transform="translate(180, 125)">
      <rect x="0" y="0" width="460" height="30" rx="15" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#10b981"/>
      <text x="32" y="19" fill="#e0f2fe" font-size="10.5" class="mono">
        QUERY: "Analyze temperature anomalies across North Atlantic floats"
      </text>
    </g>
  </g>

  <!-- Footer Callout -->
  <g transform="translate(35, 335)">
    <text x="0" y="0" fill="#0284c7" font-size="10" class="mono">
      CONVERTING HIGH-DIMENSIONAL OCEAN DATASETS INTO INTUITIVE NATURAL LANGUAGE INSIGHTS
    </text>
  </g>
</svg>
