<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dhammuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes flowPulse {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      .pipe-flow { stroke-dasharray: 8 6; animation: flowPulse 2s linear infinite; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.5px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#dhammuBg)" rx="12" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Card Top Banner -->
  <g transform="translate(35, 30)">
    <!-- Flagship Badge -->
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="16" fill="#38bdf8" font-size="10.5" class="mono" font-weight="700" text-anchor="middle">★ FLAGSHIP SYSTEM</text>
    
    <!-- Title & Tagline -->
    <text x="0" y="55" fill="#ffffff" font-size="26" class="sans" font-weight="900" letter-spacing="1">DHAMMU — AGENTIC DESKTOP AI ASSISTANT</text>
    <text x="0" y="76" fill="#94a3b8" font-size="13" class="sans">
      Architected to treat the computer as its home • Multi-step autonomous planning, execution &amp; verification with safety boundaries
    </text>
  </g>

  <!-- THE PIPELINE FLOW DIAGRAM -->
  <g transform="translate(35, 140)">
    <!-- Connecting Bus Line -->
    <line x1="60" y1="40" x2="770" y2="40" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="40" x2="770" y2="40" stroke="url(#cyanLine)" stroke-width="3" class="pipe-flow"/>

    <!-- STAGE 1: VOICE -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="105" height="80" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="52" cy="26" r="14" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <path d="M 48 20 Q 52 14 56 20 L 56 28 Q 52 34 48 28 Z" fill="#38bdf8"/>
      <text x="52" y="58" fill="#e0f2fe" font-size="11" class="mono" font-weight="800" text-anchor="middle">01. VOICE</text>
      <text x="52" y="70" fill="#38bdf8" font-size="8.5" class="mono" text-anchor="middle">INPUT STREAM</text>
    </g>

    <!-- STAGE 2: UNDERSTAND -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="115" height="80" rx="8" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="57" cy="26" r="14" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
      <polygon points="57,17 65,30 49,30" fill="#818cf8"/>
      <text x="57" y="58" fill="#e0e7ff" font-size="11" class="mono" font-weight="800" text-anchor="middle">02. UNDERSTAND</text>
      <text x="57" y="70" fill="#818cf8" font-size="8.5" class="mono" text-anchor="middle">INTENT &amp; CONTEXT</text>
    </g>

    <!-- STAGE 3: PLAN -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="105" height="80" rx="8" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="52" cy="26" r="14" fill="#6b21a8" fill-opacity="0.3" stroke="#a855f7" stroke-width="1"/>
      <rect x="45" y="19" width="14" height="14" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <text x="52" y="58" fill="#f3e8ff" font-size="11" class="mono" font-weight="800" text-anchor="middle">03. PLAN</text>
      <text x="52" y="70" fill="#c084fc" font-size="8.5" class="mono" text-anchor="middle">AGENTIC DAG</text>
    </g>

    <!-- STAGE 4: EXECUTE -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="110" height="80" rx="8" fill="url(#nodeGrad)" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="55" cy="26" r="14" fill="#9d174d" fill-opacity="0.3" stroke="#ec4899" stroke-width="1"/>
      <polygon points="52,20 62,26 52,32" fill="#f472b6"/>
      <text x="55" y="58" fill="#fce7f3" font-size="11" class="mono" font-weight="800" text-anchor="middle">04. EXECUTE</text>
      <text x="55" y="70" fill="#f472b6" font-size="8.5" class="mono" text-anchor="middle">DESKTOP TOOLS</text>
    </g>

    <!-- STAGE 5: VERIFY -->
    <g transform="translate(585, 0)">
      <rect x="0" y="0" width="110" height="80" rx="8" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="55" cy="26" r="14" fill="#b45309" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1"/>
      <path d="M 48 26 L 53 31 L 63 21" stroke="#fbbf24" stroke-width="2" fill="none"/>
      <text x="55" y="58" fill="#fef3c7" font-size="11" class="mono" font-weight="800" text-anchor="middle">05. VERIFY</text>
      <text x="55" y="70" fill="#fbbf24" font-size="8.5" class="mono" text-anchor="middle">SAFETY BOUNDS</text>
    </g>

    <!-- STAGE 6: RESULT -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="105" height="80" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="52" cy="26" r="14" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <circle cx="52" cy="26" r="5" fill="#34d399"/>
      <text x="52" y="58" fill="#d1fae5" font-size="11" class="mono" font-weight="800" text-anchor="middle">06. RESULT</text>
      <text x="52" y="70" fill="#34d399" font-size="8.5" class="mono" text-anchor="middle">DESIRED STATE</text>
    </g>
  </g>

  <!-- HONEST STATUS TRACKER -->
  <g transform="translate(35, 275)">
    <rect x="0" y="0" width="830" height="65" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Status 1 -->
    <g transform="translate(25, 22)">
      <circle cx="6" cy="6" r="5" fill="#10b981" />
      <text x="20" y="10" fill="#ffffff" font-size="11" class="mono" font-weight="700">COMPLETED</text>
      <text x="20" y="24" fill="#64748b" font-size="10" class="sans">Voice Input &amp; Parsing</text>
    </g>

    <!-- Status 2 -->
    <g transform="translate(225, 22)">
      <circle cx="6" cy="6" r="5" fill="#3b82f6" />
      <text x="20" y="10" fill="#ffffff" font-size="11" class="mono" font-weight="700">IN DEVELOPMENT</text>
      <text x="20" y="24" fill="#64748b" font-size="10" class="sans">Agentic Planning Engine</text>
    </g>

    <!-- Status 3 -->
    <g transform="translate(435, 22)">
      <circle cx="6" cy="6" r="5" fill="#f59e0b" />
      <text x="20" y="10" fill="#ffffff" font-size="11" class="mono" font-weight="700">EXPERIMENTAL</text>
      <text x="20" y="24" fill="#64748b" font-size="10" class="sans">3D Avatar &amp; Safety Guard</text>
    </g>

    <!-- Status 4 -->
    <g transform="translate(635, 22)">
      <circle cx="6" cy="6" r="5" fill="#a855f7" />
      <text x="20" y="10" fill="#ffffff" font-size="11" class="mono" font-weight="700">FUTURE VISION</text>
      <text x="20" y="24" fill="#64748b" font-size="10" class="sans">Full Computer-as-Home Autonomy</text>
    </g>
  </g>
</svg>
