<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blinkFast { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes blinkSlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .beacon-online { animation: blinkSlow 2s ease-in-out infinite; }
      .beacon-exploring { animation: blinkFast 1.2s ease-in-out infinite; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.5px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#termBg)" rx="10" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <g transform="translate(0, 0)">
    <rect width="100%" height="34" fill="#0f172a" rx="10 10 0 0"/>
    <!-- Terminal window controls -->
    <circle cx="20" cy="17" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="52" cy="17" r="5" fill="#10b981" opacity="0.8"/>
    <text x="75" y="21" fill="#64748b" font-size="10.5" class="mono">TERMINAL://SYSTEM_STATUS_MONITOR.AI</text>
    <text x="730" y="21" fill="#38bdf8" font-size="10" class="mono">STATUS: OPERATIONAL</text>
  </g>

  <!-- 2 COLUMN MATRIX OF SYSTEM STATUSES -->
  <g transform="translate(40, 60)">
    <!-- COLUMN 1 -->
    <!-- 1. AI ENGINEERING -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#10b981" class="beacon-online" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">AI ENGINEERING</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="317" y="25" fill="#34d399" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">ONLINE</text>
    </g>

    <!-- 2. MACHINE LEARNING -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#10b981" class="beacon-online" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">MACHINE LEARNING</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="317" y="25" fill="#34d399" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">ONLINE</text>
    </g>

    <!-- 3. DATA SCIENCE -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#10b981" class="beacon-online" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">DATA SCIENCE</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="317" y="25" fill="#34d399" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">ONLINE</text>
    </g>

    <!-- 4. SYSTEM BUILDING -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#06b6d4" class="beacon-online" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">SYSTEM BUILDING</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
      <text x="317" y="25" fill="#22d3ee" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- COLUMN 2 -->
    <!-- 5. AGENTIC AI -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#a855f7" class="beacon-exploring" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">AGENTIC AI</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
      <text x="317" y="25" fill="#c084fc" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">EXPLORING</text>
    </g>

    <!-- 6. AI AUTOMATION -->
    <g transform="translate(440, 50)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#a855f7" class="beacon-exploring" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">AI AUTOMATION</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
      <text x="317" y="25" fill="#c084fc" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">EXPLORING</text>
    </g>

    <!-- 7. 3D AI INTERFACES -->
    <g transform="translate(440, 100)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#f59e0b" class="beacon-exploring" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">3D AI INTERFACES</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text x="317" y="25" fill="#fde047" font-size="8.5" class="mono" font-weight="800" text-anchor="middle">EXPERIMENTAL</text>
    </g>

    <!-- 8. DSA / ALGORITHMS -->
    <g transform="translate(440, 150)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#3b82f6" class="beacon-online" filter="url(#glow)"/>
      <text x="36" y="25" fill="#f1f5f9" font-size="12" class="mono" font-weight="700">DSA / ALGORITHMS</text>
      <rect x="270" y="11" width="95" height="20" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="317" y="25" fill="#93c5fd" font-size="9.5" class="mono" font-weight="800" text-anchor="middle">LEARNING</text>
    </g>
  </g>

  <!-- Terminal Bottom Footer Bar -->
  <g transform="translate(40, 270)">
    <text x="0" y="0" fill="#475569" font-size="10" class="mono">&gt; continuous_optimization_loop = ACTIVE // REPO_SYNC: REALTIME</text>
  </g>
</svg>
