<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="loopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="loopFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes loopDash { to { stroke-dashoffset: -40; } }
      .flow-pulse { stroke-dasharray: 6 4; animation: loopDash 1.5s linear infinite; }
      .mono { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.5px; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#loopBg)" rx="10" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Title -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" fill="#38bdf8" font-size="11" class="mono" font-weight="700">PHILOSOPHY://THE_ENGINEERING_RECURSION_LOOP</text>
  </g>

  <!-- Flow Line Across Steps -->
  <line x1="60" y1="85" x2="840" y2="85" stroke="#1e293b" stroke-width="4"/>
  <line x1="60" y1="85" x2="840" y2="85" stroke="url(#loopFlow)" stroke-width="2.5" class="flow-pulse"/>

  <!-- 7 NODES: IDEA -> RESEARCH -> DESIGN -> BUILD -> TEST -> IMPROVE -> SHIP -->
  <!-- 1. IDEA -->
  <g transform="translate(45, 55)">
    <circle cx="28" cy="30" r="16" fill="#0c192e" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
    <text x="28" y="34" fill="#22d3ee" font-size="10" class="mono" font-weight="800" text-anchor="middle">01</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">IDEA</text>
  </g>

  <!-- 2. RESEARCH -->
  <g transform="translate(170, 55)">
    <circle cx="28" cy="30" r="16" fill="#0c192e" stroke="#0284c7" stroke-width="2"/>
    <text x="28" y="34" fill="#38bdf8" font-size="10" class="mono" font-weight="800" text-anchor="middle">02</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">RESEARCH</text>
  </g>

  <!-- 3. DESIGN -->
  <g transform="translate(295, 55)">
    <circle cx="28" cy="30" r="16" fill="#0c192e" stroke="#3b82f6" stroke-width="2"/>
    <text x="28" y="34" fill="#60a5fa" font-size="10" class="mono" font-weight="800" text-anchor="middle">03</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">DESIGN</text>
  </g>

  <!-- 4. BUILD -->
  <g transform="translate(420, 55)">
    <circle cx="28" cy="30" r="16" fill="#1e1035" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <text x="28" y="34" fill="#c084fc" font-size="10" class="mono" font-weight="800" text-anchor="middle">04</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">BUILD</text>
  </g>

  <!-- 5. TEST -->
  <g transform="translate(545, 55)">
    <circle cx="28" cy="30" r="16" fill="#2d1215" stroke="#f43f5e" stroke-width="2"/>
    <text x="28" y="34" fill="#fb7185" font-size="10" class="mono" font-weight="800" text-anchor="middle">05</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">TEST</text>
  </g>

  <!-- 6. IMPROVE -->
  <g transform="translate(670, 55)">
    <circle cx="28" cy="30" r="16" fill="#291804" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fbbf24" font-size="10" class="mono" font-weight="800" text-anchor="middle">06</text>
    <text x="28" y="60" fill="#f1f5f9" font-size="10" class="mono" font-weight="700" text-anchor="middle">IMPROVE</text>
  </g>

  <!-- 7. SHIP -->
  <g transform="translate(795, 55)">
    <circle cx="28" cy="30" r="18" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
    <text x="28" y="34" fill="#34d399" font-size="11" class="mono" font-weight="900" text-anchor="middle">🚀</text>
    <text x="28" y="60" fill="#34d399" font-size="10.5" class="mono" font-weight="800" text-anchor="middle">SHIP</text>
  </g>
</svg>
